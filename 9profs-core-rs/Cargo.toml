[workspace]
resolver = "3"
members = [
    "crates/nineprofs-common",
    "crates/nineprofs-api-types",
    "crates/nineprofs-db",
    "crates/nineprofs-realtime",
    "crates/nineprofs-skills",
    "crates/nineprofs-assistant",
    "crates/nineprofs-agent",
    "crates/nineprofs-runtime",
    "app/nineprofs-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
