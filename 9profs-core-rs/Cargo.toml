[workspace]
resolver = "3"
members = [
    "crates/nineprofs-common",
    "crates/nineprofs-api-types",
    "crates/nineprofs-db",
    "crates/nineprofs-realtime",
    "crates/nineprofs-documents",
    "crates/nineprofs-document-tools",
    "crates/nineprofs-skills",
    "crates/nineprofs-assistant",
    "crates/nineprofs-tools",
    "crates/nineprofs-officecli",
    "crates/nineprofs-mcp",
    "crates/nineprofs-agent",
    "crates/nineprofs-research",
    "crates/nineprofs-research-opendataloader",
    "crates/nineprofs-research-dify",
    "crates/nineprofs-structured-model",
    "crates/nineprofs-research-assessor",
    "crates/nineprofs-research-claim-extractor",
    "crates/nineprofs-research-verification",
    "crates/nineprofs-runtime",
    "app/nineprofs-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
aion-agent = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-config = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-mcp = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-protocol = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-types = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
aion-tools = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
