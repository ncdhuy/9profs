name: Upstream / inherited diagnostics

# Manual only: these checks preserve visibility into inherited GenOffice and
# environment-sensitive quality without becoming normal 9Profs merge gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package_tests:
    name: Inherited tests (${{ matrix.workspace }})
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - '@genoffice/electron-utils'
          - '@genoffice/ai-search'
          - '@genoffice/slides'
          - '@genoffice/pdf'
          - '@genoffice/markdown'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run inherited package tests
        run: npm run test -w ${{ matrix.workspace }}

  full_suite:
    name: Full inherited npm test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full inherited suite
        run: npm test

  lint:
    name: Whole-repository ESLint diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
